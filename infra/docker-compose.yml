# Stack do Docker Swarm (deploy pelo Portainer). Não use name:, pull_policy, container_name,
# restart nem build: o docker stack deploy recusa ou ignora. Guia do servidor: INSTARTUPS/infra/README.md
version: "3.8"

services:
  api-auth:
    image: ghcr.io/braynerdev/api-instartups-auth:${IMAGE_TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      TZ: America/Sao_Paulo
      ConnectionStrings__PostgresConnection: "Host=${DB_HOST:?defina DB_HOST no .env};Port=${DB_PORT:-5432};Database=${DB_NAME:?defina DB_NAME no .env};Username=${DB_USER:?defina DB_USER no .env};Password=${DB_PASSWORD:?defina DB_PASSWORD no .env};SSL Mode=${DB_SSL_MODE:-Prefer};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=50;Gss Encryption Mode=Disable"
      Jwt__Issuer: ${JWT_ISSUER:?defina JWT_ISSUER no .env}
      Jwt__Audience: ${JWT_AUDIENCE:?defina JWT_AUDIENCE no .env}
      Cursor__SecretKey: ${CURSOR_SECRET_KEY:?defina CURSOR_SECRET_KEY no .env}
      AdminUser__Email: ${ADMIN_EMAIL:-}
      AdminUser__UserName: ${ADMIN_USERNAME:-}
      AdminUser__Password: ${ADMIN_PASSWORD:-}
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:?defina JWT_PRIVATE_KEY_FILE no .env (caminho absoluto no servidor)}:/run/keys/jwt-private.pem:ro
      - ${JWT_PUBLIC_KEY_FILE:?defina JWT_PUBLIC_KEY_FILE no .env (caminho absoluto no servidor)}:/run/keys/jwt-public.pem:ro
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.instartups-auth.rule=Host(`${API_DOMAIN:?defina API_DOMAIN no .env}`) && (PathPrefix(`/api/auth`) || PathPrefix(`/api/user`) || PathPrefix(`/api/permission`) || PathPrefix(`/api/healthcheck`))"
        - "traefik.http.routers.instartups-auth.entrypoints=websecure"
        - "traefik.http.routers.instartups-auth.tls.certresolver=letsencrypt"
        - "traefik.http.routers.instartups-auth.service=instartups-auth"
        - "traefik.http.services.instartups-auth.loadbalancer.server.port=8080"

# Rede overlay criada uma vez no servidor: docker network create --driver overlay --attachable proxy
networks:
  proxy:
    external: true
